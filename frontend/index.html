<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Wydatków</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4 text-center">💰 Tracker Wydatków</h1>

        <div class="card mb-4 shadow-sm">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">Suma wydatków</h5>
                <h2 class="text-primary mb-0" id="total">0.00 zł</h2>
            </div>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h5 class="card-title" id="formTitle">Dodaj nowy wydatek</h5>
                <form id="expenseForm">
                    <input type="hidden" id="expenseId">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Kwota (zł)</label>
                            <input type="number" step="0.01" class="form-control" id="amount" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Kategoria</label>
                            <input type="text" class="form-control" id="category" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="date" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Dodaj</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancelBtn">Anuluj</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Lista wydatków</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Kwota</th>
                                <th>Kategoria</th>
                                <th>Data</th>
                                <th class="text-end">Akcje</th>
                            </tr>
                        </thead>
                        <tbody id="expensesList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
